name: Contracts and chain sync

# Runs on every pull request (and push to main) that touches the contract, the chain-sync function,
# the database it reads, or this workflow.
#   contract-tests: compiles the SolarCredit contract and runs its Hardhat tests.
#   end-to-end:     starts a local blockchain, deploys the contract, then runs database actions through the
#                   chain_events outbox and the chain-sync logic onto the chain and checks the database matches it.
on:
  pull_request:
    paths: ["contracts/**", "supabase/functions/**", "supabase/migrations/**", "supabase/tests/**", ".github/workflows/contracts.yml"]
  push:
    branches: [main]
    paths: ["contracts/**", "supabase/functions/**", "supabase/migrations/**", "supabase/tests/**", ".github/workflows/contracts.yml"]

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm test

  end-to-end:
    runs-on: ubuntu-latest
    needs: contract-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            supabase/package-lock.json
      - name: Install contracts and test dependencies
        run: |
          (cd contracts && npm ci)
          (cd supabase && npm ci)
      - name: Start a local blockchain and deploy the contract
        working-directory: contracts
        run: |
          nohup npx hardhat node > hardhat-node.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -X POST -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' http://127.0.0.1:8545 > /dev/null && break
            sleep 1
          done
          npm run deploy:local
      - name: End-to-end test (database -> outbox -> chain-sync -> chain)
        working-directory: supabase
        run: node tests/e2e.mjs
